<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scratch here…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT YOUR DETAILS in the CONFIG block near the bottom.
     ============================================================ */
  :root{
    --plum:#31163f; --wine:#7e2a54; --rose:#e8697c;
    --coral:#ff6f91; --cream:#fff4f0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 90% at 50% -10%, #45215a 0%, transparent 55%),
      linear-gradient(170deg, var(--plum) 0%, var(--wine) 52%, var(--rose) 100%);
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:28px; text-align:center; -webkit-user-select:none; user-select:none;
  }
  .wrap{ width:100%; max-width:420px; }
  .eyebrow{ font-size:.95rem; opacity:.82; margin:0 0 6px; }
  h1{
    font-family:"Fraunces",Georgia,serif; font-weight:600;
    font-size:clamp(1.9rem,7vw,2.6rem); line-height:1.1; margin:0 0 20px; text-wrap:balance;
  }

  /* the scratch area */
  .scratch{
    position:relative; width:100%; height:300px; border-radius:24px; overflow:hidden;
    box-shadow:0 18px 45px rgba(20,6,20,.4); isolation:isolate;
  }
  .reveal{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; padding:26px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:24px;
  }
  .reveal .title{ font-family:"Fraunces",Georgia,serif; font-size:1.5rem; font-weight:600; }
  .reveal .when{ font-size:1.6rem; font-weight:600; }
  .reveal .where{ font-size:1.05rem; opacity:.9; }
  .reveal .note{ font-size:.95rem; opacity:.82; margin-top:6px; max-width:26ch; }

  canvas{
    position:absolute; inset:0; width:100%; height:100%;
    border-radius:24px; touch-action:none; cursor:grab;
    transition:opacity .6s ease;
  }
  canvas:active{ cursor:grabbing; }

  .hint{ font-size:.95rem; opacity:.8; margin:16px 0 0; height:1.2em; transition:opacity .4s ease; }

  .heart{ position:fixed; top:-40px; font-size:24px; pointer-events:none; z-index:10; will-change:transform; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="headline"></h1>

    <div class="scratch" id="scratch">
      <div class="reveal">
        <div class="title" id="rTitle"></div>
        <div class="when"  id="rWhen"></div>
        <div class="where" id="rWhere"></div>
        <div class="note"  id="rNote"></div>
      </div>
      <canvas id="foil"></canvas>
    </div>

    <p class="hint" id="hint">👆 Scratch the panel to reveal it</p>
  </div>

<script>
  /* =========================================================
     CONFIG — edit these to whatever you like.
     ========================================================= */
  const CONFIG = {
    eyebrow:  "Since you said yes once already… 😏",
    headline: "Date night, round two",
    scratchText: "SCRATCH ME 💛",
    reveal: {
      title: "You're coming with me…",
      when:  "The 8th · 3:15",
      where: "to the museum",
      note:  "Dress nice. I've got the rest handled. 💛"
    }
  };

  const $ = id => document.getElementById(id);
  $('eyebrow').textContent = CONFIG.eyebrow;
  $('headline').textContent = CONFIG.headline;
  $('rTitle').textContent = CONFIG.reveal.title;
  $('rWhen').textContent  = CONFIG.reveal.when;
  $('rWhere').textContent = CONFIG.reveal.where;
  $('rNote').textContent  = CONFIG.reveal.note;
  document.title = CONFIG.headline;

  const canvas = $('foil');
  const box = $('scratch');
  const ctx = canvas.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let done = false;

  function paintFoil(){
    const rect = box.getBoundingClientRect();
    canvas.width  = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const w = rect.width, h = rect.height;

    // metallic-rose foil
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,   '#c9748c');
    g.addColorStop(.35, '#e59aad');
    g.addColorStop(.5,  '#ffd9e2');
    g.addColorStop(.65, '#e59aad');
    g.addColorStop(1,   '#b85f7d');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    // subtle sheen streaks
    ctx.globalAlpha = .18;
    ctx.fillStyle = '#ffffff';
    for(let i=-h;i<w;i+=26){ ctx.fillRect(i,0,8,h); }
    ctx.globalAlpha = 1;

    // label
    ctx.fillStyle = 'rgba(60,10,40,.55)';
    ctx.font = '600 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(CONFIG.scratchText, w/2, h/2);

    ctx.globalCompositeOperation = 'destination-out';
  }
  paintFoil();

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:p.clientX - rect.left, y:p.clientY - rect.top };
  }
  function scratch(x,y){
    ctx.beginPath();
    ctx.arc(x,y,26,0,Math.PI*2);
    ctx.fill();
  }

  let drawing = false, last = null, samples = 0;
  function start(e){ drawing = true; const p = pos(e); last = p; scratch(p.x,p.y); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    // interpolate so fast swipes don't leave gaps
    const dist = Math.hypot(p.x-last.x, p.y-last.y);
    const steps = Math.max(1, Math.floor(dist/10));
    for(let i=0;i<=steps;i++){
      scratch(last.x + (p.x-last.x)*i/steps, last.y + (p.y-last.y)*i/steps);
    }
    last = p;
    if((samples++ % 6) === 0) checkCleared();
  }
  function end(){ drawing = false; checkCleared(); }

  function checkCleared(){
    if(done) return;
    const img = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let clear = 0;
    for(let i=3;i<img.length;i+=4*40){ if(img[i]===0) clear++; }
    const total = img.length/(4*40);
    if(clear/total > 0.5) finish();
  }
  function finish(){
    done = true;
    canvas.style.opacity = '0';
    setTimeout(()=>canvas.remove(), 600);
    $('hint').textContent = "It's a date 💛";
    rainHearts();
  }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  window.addEventListener('resize', ()=>{ if(!done){ dpr=Math.max(1,window.devicePixelRatio||1); paintFoil(); } });

  function rainHearts(){
    const glyphs = ['💛','💗','💖','❤️','✨','🌸'];
    for(let i=0;i<26;i++){
      const s=document.createElement('div');
      s.className='heart'; s.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
      s.style.left=Math.random()*100+'vw'; s.style.fontSize=(16+Math.random()*24)+'px';
      document.body.appendChild(s);
      const dur=2200+Math.random()*2000, drift=(Math.random()*2-1)*120;
      s.animate([
        {transform:'translate(0,0) rotate(0deg)',opacity:1},
        {transform:'translate('+drift+'px,'+(window.innerHeight+120)+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:1}
      ],{duration:dur,easing:'cubic-bezier(.4,0,.7,1)'});
      setTimeout(()=>s.remove(),dur);
    }
  }
</script>
</body>
</html>
